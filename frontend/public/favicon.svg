<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cámara de transmisión en vivo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243456"/>
      <stop offset="1" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7ECF3"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>

  <!-- asa superior -->
  <rect x="17" y="17" width="2.8" height="9" rx="1.4" fill="#D4DBE6"/>
  <rect x="27" y="17" width="2.8" height="9" rx="1.4" fill="#D4DBE6"/>
  <rect x="15" y="15" width="17" height="3.8" rx="1.9" fill="url(#body)"/>

  <!-- pedestal -->
  <rect x="28" y="42" width="4" height="5" rx="1" fill="#C3CCDA"/>
  <rect x="21" y="46" width="18" height="3.4" rx="1.7" fill="url(#body)"/>

  <!-- cono del lente -->
  <polygon points="40,29 40,39 47,36 47,32" fill="#DCE3EC"/>

  <!-- cuerpo -->
  <rect x="11" y="24" width="30" height="18" rx="4.5" fill="url(#body)"/>
  <rect x="14.5" y="28" width="9" height="5.5" rx="1.4" fill="#C9D3E0"/>
  <circle cx="28.5" cy="30.7" r="1.7" fill="#1D9E75"/>
  <circle cx="28.5" cy="35.6" r="1.3" fill="#AEB8C7"/>

  <!-- lente -->
  <circle cx="47.5" cy="34" r="7" fill="#FFFFFF"/>
  <circle cx="47.5" cy="34" r="5.1" fill="#1D9E75"/>
  <circle cx="47.5" cy="34" r="2.7" fill="#123A2E"/>
  <circle cx="45.6" cy="32" r="1.2" fill="#CFF3E4"/>

  <!-- luz EN VIVO -->
  <circle cx="43" cy="16.5" r="6.4" fill="#E24B4A" opacity="0.3"/>
  <circle cx="43" cy="16.5" r="4.3" fill="#E24B4A"/>
  <circle cx="43" cy="16.5" r="1.8" fill="#FFFFFF"/>
</svg>
